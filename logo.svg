<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  
  <!-- Фон -->
  <rect width="600" height="200" rx="12" fill="#0F172A"/>
  
  <!-- Оранжевая полоса слева -->
  <rect x="0" y="0" width="6" height="200" fill="#F59E0B" rx="0 0 0 0"/>
  
  <!-- === КРУГ С АТОМОМ === -->
  <g transform="translate(60, 100)">
    <!-- Внешний круг (рамка) -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#3B82F6" stroke-width="2.5" opacity="0.3"/>
    
    <!-- Орбита 1 (горизонтальная) -->
    <ellipse cx="0" cy="0" rx="32" ry="32" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
    
    <!-- Орбита 2 (повернута на 60°) -->
    <ellipse cx="0" cy="0" rx="32" ry="32" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.6" transform="rotate(60)"/>
    
    <!-- Орбита 3 (повернута на 120°) -->
    <ellipse cx="0" cy="0" rx="32" ry="32" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.6" transform="rotate(120)"/>
    
    <!-- Точки на орбите 1 (0° и 180°) -->
    <circle cx="32" cy="0" r="4" fill="#60A5FA" opacity="0.9"/>
    <circle cx="-32" cy="0" r="4" fill="#60A5FA" opacity="0.9"/>
    
    <!-- Точки на орбите 2 (60° и 240°) -->
    <circle cx="16" cy="27.7" r="4" fill="#60A5FA" opacity="0.9"/>
    <circle cx="-16" cy="-27.7" r="4" fill="#60A5FA" opacity="0.9"/>
    
    <!-- Точки на орбите 3 (120° и 300°) -->
    <circle cx="-16" cy="27.7" r="4" fill="#60A5FA" opacity="0.9"/>
    <circle cx="16" cy="-27.7" r="4" fill="#60A5FA" opacity="0.9"/>
    
    <!-- Центральное ядро -->
    <circle cx="0" cy="0" r="8" fill="#F59E0B"/>
    <circle cx="0" cy="0" r="8" fill="url(#glow)" opacity="0.3"/>
  </g>
  
  <!-- Градиент для свечения -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- === ТЕКСТЫ === -->
  <!-- ShopCore -->
  <text x="130" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF">
    Shop
  </text>
  <text x="268" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="800" fill="#3B82F6">
    Core
  </text>
  
  <!-- Слоган -->
  <text x="130" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="4">
    CORE OF YOUR E-COMMERCE
  </text>
  
  <!-- Декоративная линия -->
  <line x1="130" y1="126" x2="210" y2="126" stroke="#F59E0B" stroke-width="2.5"/>
  
  <!-- Теги -->
  <text x="130" y="155" font-family="'Courier New', monospace" font-size="12" fill="#475569" letter-spacing="2">
    PYTHON · OOP · E-COMMERCE
  </text>

</svg>
